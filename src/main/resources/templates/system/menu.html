<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout/head :: head('시스템 > 메뉴 관리')"></th:block>
    <script src="/assets/js/system/menu.js"></script>
</head>
<body>
    <div th:replace="layout/header :: header('system')"></div>

    <!-- ========== 메인 컨테이너 ========== -->
    <div class="main-container">
        <aside th:replace="layout/sidebar :: sidebar('system-menu')"/>

        <!-- ========== 메인 콘텐츠 영역 ========== -->
        <main class="content">
            <div class="content-header">
                <h1>메뉴 관리</h1>
                <p>시스템 메뉴를 검색, 등록, 수정, 삭제할 수 있습니다.</p>
            </div>

            <div class="toolbar">
                <button id="__btnCreate" type="button" class="btn-primary">최상위 메뉴 추가</button>
            </div>

            <div class="tree-container">
                <div id="__tree_list" class="tree-list">
                    <div class="tree-empty">메뉴 데이터가 없습니다.</div>
                </div>
            </div>

            <!-- 페이지네이션 영역 -->
            <!-- 메뉴는 트리 구조로 전체 로드 -->
        </main>
    </div>

    <div class="modal-backdrop" id="__modal">
        <div class="modal-dialog">
            <h2 id="__modal_title">메뉴 등록</h2>
            <input type="hidden" name="seq"/>
            <input type="hidden" name="parentSeq"/>
            <input type="hidden" name="depth"/>

            <div class="modal-row">
                <label for="__modal_parentName">상위 메뉴</label>
                <input type="text" id="__modal_parentName" name="parentName" readonly />
            </div>
            <div class="modal-row">
                <label for="__modal_name">메뉴명<span class="required">*</span></label>
                <input type="text" id="__modal_name" name="name" required maxlength="100" />
            </div>
            <div class="modal-row">
                <label for="__modal_url">URL</label>
                <input type="text" id="__modal_url" name="url" maxlength="200" placeholder="예: /system/menu" />
            </div>
            <div class="modal-row">
                <label for="__modal_matchUrl">Match URL</label>
                <input type="text" id="__modal_matchUrl" name="matchUrl" maxlength="200" placeholder="정규표현식" />
            </div>
            <div class="modal-row">
                <label for="__modal_sorting">정렬순서</label>
                <input type="number" id="__modal_sorting" name="sorting" value="0" min="0" />
            </div>
            <div class="modal-actions">
                <button id="__modal_btn_cancel" type="button" class="btn-secondary">취소</button>
                <button id="__modal_btn_addSub" type="button" class="btn-secondary" style="display:none;">하위 메뉴 추가</button>
                <button id="__modal_btn_save" type="submit" class="btn-submit">저장</button>
            </div>
        </div>
    </div>

    <div th:replace="layout/footer :: footer"></div>
</body>
</html>
