<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/head :: head('게시판 > ' + ${boardType.description})}"></th:block>
    <script src="/assets/js/boards/board.js"></script>
</head>
<body class="is-preload">
    <div th:replace="~{layout/header :: header('boards')}"></div>

    <div class="main-container">
        <aside th:replace="~{layout/sidebar :: sidebar('boards-' + ${boardType.name().toLowerCase()})}"></aside>

        <main class="content">
            <div class="content-header">
                <h1 th:text="${boardType.description} + ' 상세 정보'"></h1>
                <p th:text="${boardType.description} + '의 상세 정보를 확인하거나 수정, 삭제할 수 있습니다.'"></p>
            </div>

            <div class="detail-section">
                <input type="hidden" id="__item_seq" th:value="${item.seq}" />
                <input type="hidden" id="__boardName" th:value="${boardType.name().toLowerCase()}" />
                <div class="detail-row">
                    <label>제목</label>
                    <span th:text="${item.title}"></span>
                </div>
                <div class="detail-row">
                    <label>상단고정</label>
                    <span th:text="${item.topFixed} ? '예' : '아니오'"></span>
                </div>
                <div class="detail-row">
                    <label>생성일시</label>
                    <span th:text="${item.createDatetime}"></span>
                </div>
                <div class="detail-row">
                    <label>수정일시</label>
                    <span th:text="${item.updateDatetime}"></span>
                </div>
                <div class="detail-row detail-content">
                    <label>내용</label>
                    <div th:text="${item.content}" style="white-space: pre-wrap;"></div>
                </div>
                <div class="detail-row">
                    <label>첨부파일</label>
                    <div>
                        <ul style="padding-left: 20px;">
                            <li th:each="file : ${item.files}">
                                <a th:href="@{/file/download/{fileId}(fileId=${file.fileId})}" th:text="${file.originalName}" target="_blank"></a>
                            </li>
                        </ul>
                        <span th:if="${item.files == null or #lists.isEmpty(item.files)}">첨부파일이 없습니다.</span>
                    </div>
                </div>

                <div class="detail-actions">
                    <button id="__btnEdit" type="button" class="btn-secondary">수정</button>
                    <button id="__btnDelete" type="button" class="btn-danger">삭제</button>
                    <button id="__btnBack" type="button" class="btn-secondary">목록으로</button>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
