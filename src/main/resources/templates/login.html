<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="layout/head :: head('시스템 > 메뉴 관리')"></th:block>
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js"></script>
</head>
<body>
    <div class="login-box">
        <h1>로그인</h1>
        <!-- <form method="post" action="/login"> -->
            <label for="__username">아이디</label>
            <input id="__username" name="username" type="text" required autocomplete="username" />
            <label for="__password">비밀번호</label>
            <input id="__password" name="password" type="password" required autocomplete="current-password" />
            <div style="margin-bottom:16px; display:flex; align-items:center; visibility:visible;">
                <input id="remember-me" name="remember-me" type="checkbox" checked />
                <label for="remember-me" style="margin-left:8px; margin-bottom:0; font-size:14px; cursor:pointer;">아이디와 비밀번호 저장 (24시간)</label>
            </div>
            <button id="__btn_login" type="submit">로그인</button>
        <!-- </form> -->
        <div class="message" id="message"></div>
        <div style="display:flex; gap:12px; margin-top:16px;">
            <button type="button" onclick="window.location.href='/register'" style="flex:1; background:#28a745;">회원가입</button>
            <button type="button" onclick="window.location.href='/password-reset-request'" style="flex:1; background:#f0ad4e;">비밀번호 초기화</button>
        </div>
    </div>
    <script>
    </script>
    <div th:replace="layout/footer :: footer"></div>
</body>
</html>
