<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="admin/layout/head :: head('시스템 > 인가 관리')"></th:block>
    <script src="/assets/admin/js/system/authorization.js"></script>
</head>
<body>
    <div th:replace="admin/layout/header :: header('system')"></div>

    <div class="main-container">
        <aside th:replace="admin/layout/sidebar :: sidebar('system-authorization')"/>

        <main class="content">
            <div class="content-header">
                <h1>인가 관리</h1>
                <p>권한에 따라 메뉴 접근 권한을 관리합니다.</p>
            </div>

            <div class="authorization-layout">
                <section class="authorization-panel">
                    <div class="panel-header">
                        <h2>권한 선택</h2>
                        <p>연결할 권한을 선택하세요.</p>
                    </div>
                    <div class="authorization-list">
                        <label th:if="${not #lists.isEmpty(list)}" class="authorization-item" th:each="auth : ${list}">
                            <input type="radio" name="seq" th:value="${auth.seq}"/>
                            <span th:text="${auth.name}">권한명</span>
                        </label>
                        <div th:if="${#lists.isEmpty(list)}" class="empty">권한 목록을 불러오는 중입니다.</div>
                    </div>
                </section>

                <section class="menu-panel">
                    <div class="panel-header">
                        <div>
                            <h2>메뉴 목록</h2>
                            <p>선택된 권한에 연결할 메뉴를 체크하세요.</p>
                        </div>
                        <button id="__btnSave" type="button" class="btn-primary">저장</button>
                    </div>
                    <div class="selected-auth">
                        선택된 권한: <strong id="__selected_authorization_name">없음</strong>
                    </div>
                    <div id="__menu_tree" class="menu-tree">
                        <div class="empty">권한을 선택하면 메뉴가 표시됩니다.</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div th:replace="admin/layout/footer :: footer"></div>
</body>
</html>
