<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/head :: head('게시판 > ' + ${boardType.description}, 'form')}"></th:block>
    <link rel="stylesheet" href="/assets/admin/css/main.css" />
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css" />
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="/assets/admin/js/boards/form.js"></script>
    <style>
        .file-upload-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .file-info {
            margin-top: 0.75rem;
            color: #4a5568;
            font-size: 0.95rem;
        }
        .attachment-list {
            margin-top: 0.75rem;
            padding-left: 1.25rem;
            list-style: disc;
            color: #2d3748;
        }
        .attachment-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.35rem;
        }
        .attachment-item a {
            color: #2b6cb0;
            text-decoration: none;
        }
        .attachment-item a:hover {
            text-decoration: underline;
        }
        .attachment-item button {
            border: 1px solid #cbd5e0;
            background: #edf2f7;
            color: #2d3748;
            padding: 0.25rem 0.65rem;
            border-radius: 0.35rem;
            cursor: pointer;
        }
        .attachment-item button:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body class="is-preload">
<div id="wrapper">
        <div id="main">
            <div class="inner">

                <header id="header">
                    <a href="#" class="logo"><strong>Editorial</strong> by HTML5 UP</a>
                    <ul class="icons">
                        <li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
                        <li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
                        <li><a href="#" class="icon brands fa-medium-m"><span class="label">Medium</span></a></li>
                    </ul>
                </header>

                <section>
                    <header class="major">
                        <h2 th:text="${mode == 'create'} ? ${boardType.description} + ' 등록' : ${boardType.description} + ' 수정'"></h2>
                        <p th:text="${mode == 'create'} ? ${boardType.description} + '을(를) 등록할 수 있습니다.' : ${boardType.description} + '을(를) 수정할 수 있습니다.'"></p>
                    </header>

                    <div class="box">
                        <form id="__board_form">
                            <input type="hidden" name="seq" th:value="${item == null ? 0 : item.seq}" />
                            <input type="hidden" name="type" th:value="${boardType.code}" />
                            <input type="hidden" id="__boardName" th:value="${boardType.name().toLowerCase()}" />
                            <input type="hidden" id="__mode" th:value="${mode}" />
                            <input type="hidden" id="__existingFileIds" th:value="${item == null || item.fileIds == null ? '' : item.fileIds}" />

                            <div class="row gtr-uniform">
                                <div class="col-12">
                                    <label for="__title">제목</label>
                                    <input id="__title" name="title" type="text" maxlength="255" class="text" th:value="${item == null ? '' : item.title}" required />
                                </div>

                                <div class="col-12">
                                    <label for="__topFixed">상단고정</label>
                                    <div class="checkboxes">
                                        <input id="__topFixed" name="topFixed" type="checkbox" th:checked="${item == null ? false : item.topFixed}" />
                                        <label for="__topFixed">상단고정</label>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label for="__attachment">첨부파일</label>
                                    <div class="file-upload-row">
                                        <input id="__attachment" type="file" multiple />
                                        <button id="__btn_upload_file" type="button" class="button small">업로드</button>
                                    </div>
                                    <div id="__attachment_info" class="file-info" th:text="${item != null and item.files != null and !#lists.isEmpty(item.files)} ? '업로드된 파일이 있습니다.' : '업로드된 파일이 없습니다.'"></div>
                                    <ul id="__attachment_list" class="attachment-list">
                                        <li class="attachment-item" th:each="file : ${item != null ? item.files : {}}" th:attr="data-file-id=${file.fileId}">
                                            <a th:href="@{/file/download/{fileId}(fileId=${file.fileId})}" th:text="${file.originalName}" target="_blank"></a>
                                            <button type="button" class="button small">삭제</button>
                                        </li>
                                    </ul>
                                </div>

                                <div class="col-12">
                                    <label for="__editor">내용</label>
                                    <div id="__editor" style="min-height: 320px;"></div>
                                    <textarea id="__content" name="content" required th:text="${item == null ? '' : item.content}" style="display:none;"></textarea>
                                </div>

                                <div class="col-12">
                                    <ul class="actions">
                                        <li><button id="__btn_save" type="button" class="button primary" th:text="${mode == 'create'} ? '등록' : '수정'"></button></li>
                                        <li><button id="__btn_cancel" type="button" class="button">취소</button></li>
                                    </ul>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            document.body.classList.remove('is-preload');
        });
    </script>
</body>
</html>
