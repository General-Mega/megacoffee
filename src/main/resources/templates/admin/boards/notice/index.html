<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{/admin/layout/head :: head('게시판 > ' + ${boardType.description})}"></th:block>
    <script src="/admin/js/boards/index.js"></script>
</head>
<body class="is-preload">
    <div th:replace="~{/admin/layout/header :: header('boards')}"></div>

    <div class="main-container">
        <aside th:replace="~{/admin/layout/sidebar :: sidebar('boards-' + ${boardType.name().toLowerCase()})}"></aside>

        <main class="content">
            <div class="content-header">
                <h1 th:text="${boardType.description} + ' 관리'"></h1>
                <p th:text="${boardType.description} + '을(를) 검색, 등록, 수정, 삭제할 수 있습니다.'"></p>
            </div>

            <div class="search-section">
                <input type="hidden" name="type" th:value="${boardType.code}" />
                <input type="hidden" name="page" th:value="${searching.page}" />
                <input type="hidden" name="dataCount" th:value="${searching.dataCount}" />
                <div class="search-inputs">
                    <select name="searchType" class="search-type">
                        <option value="">전체</option>
                        <option value="title" th:selected="${searching.searchType} == 'title'">제목</option>
                        <option value="content" th:selected="${searching.searchType} == 'content'">내용</option>
                    </select>
                    <input type="text" name="searchValue" placeholder="검색어를 입력하세요." th:value="${searching.searchValue}" />
                </div>
                <button id="__btn_search" type="button">검색</button>
            </div>

            <div class="toolbar">
                <button id="__btn_append" type="button" class="btn-primary">등록</button>
                <button id="__btn_remove" type="button" class="btn-danger">선택 삭제</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="__select_all"></th>
                            <th style="width: 60px;">번호</th>
                            <th>제목</th>
                            <th style="width: 100px;">상단고정</th>
                            <th style="width: 160px;">생성일시</th>
                            <th style="width: 160px;">수정일시</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6">검색 결과가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination"></div>
        </main>
    </div>

    <input type="hidden" id="__boardName" th:value="${boardType.name().toLowerCase()}" />
    <div th:replace="~{/admin/layout/footer :: footer}"></div>
</body>
</html>
