<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout/head :: head('게시판 > ' + ${boardType.description}, 'form')}"></th:block>
    <script src="/assets/admin/js/boards/board.js"></script>
</head>
<body class="is-preload">
    <div th:replace="~{layout/header :: header('boards')}"></div>

    <div class="main-container">
        <aside th:replace="~{layout/sidebar :: sidebar('boards-' + ${boardType.name().toLowerCase()})}"></aside>

        <main class="content">
            <div class="content-header">
                <h1 th:text="${mode == 'create'} ? ${boardType.description} + ' 등록' : ${boardType.description} + ' 수정'"></h1>
                <p th:text="${mode == 'create'} ? ${boardType.description} + '을(를) 등록할 수 있습니다.' : ${boardType.description} + '을(를) 수정할 수 있습니다.'"></p>
            </div>

            <div class="form-section">
                <input type="hidden" id="__boardName" th:value="${boardType.name().toLowerCase()}" />
                <input type="hidden" id="__mode" th:value="${mode}" />
                <form id="__board_form">
                    <input type="hidden" name="seq" th:value="${item.seq}" />
                    <input type="hidden" name="type" th:value="${boardType.code}" />

                    <div class="form-row">
                        <label for="__title">제목</label>
                        <input id="__title" name="title" type="text" maxlength="255" th:value="${item.title}" required />
                    </div>

                    <div class="form-row">
                        <label for="__topFixed">상단고정</label>
                        <input id="__topFixed" name="topFixed" type="checkbox" th:checked="${item.topFixed}" />
                    </div>

                    <div class="form-row">
                        <label for="__content">내용</label>
                        <textarea id="__content" name="content" rows="12" required th:text="${item.content}"></textarea>
                    </div>

                    <div class="form-actions">
                        <button id="__btn_save" type="button" class="btn-primary" th:text="${mode == 'create'} ? '등록' : '수정'"></button>
                        <button id="__btn_cancel" type="button" class="btn-secondary">취소</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
