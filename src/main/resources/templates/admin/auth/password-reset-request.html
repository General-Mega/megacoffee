<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 초기화 요청</title>
    <link rel="stylesheet" href="/admin/css/password-reset-request.css">
    <link rel="stylesheet" href="/admin/css/alert-layout.css">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/admin/js/common.js"></script></th:block>
    <script src="/admin/js/password-reset-request.js"></script>
</head>
<body>
    <div class="box">
        <h1>비밀번호 초기화 요청</h1>
        <form method="post" action="/password-reset-request">
            <label for="__username">아이디</label>
            <input id="__username" name="username" type="text" required autocomplete="username" />
            <button type="button" id="__btnRequest">요청하기</button>
        </form>
        <p class="info">요청하면 관리자 또는 시스템에서 초기화를 처리합니다.</p>
        <p class="info"><a href="/admin/login">로그인 화면으로 돌아가기</a></p>
    </div>
</body>
</html>
