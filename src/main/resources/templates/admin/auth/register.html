<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="/admin/css/register.css">
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/admin/js/common.js"></script></th:block>
    <script src="/admin/js/register.js"></script></th:block>
</head>
<body>
    <div class="register-box">
        <h1>회원가입</h1>
        <form method="post" action="/register">
            <label for="__username">아이디</label>
            <input id="__username" name="username" type="text" required autocomplete="username" />
            <a href="#" id="__btn_check_id" class="check_id">아이디 중복 확인</a>
            <label for="__password">비밀번호</label>
            <input id="__password" name="password" type="password" required autocomplete="new-password" />
            <label for="__password_confirm">비밀번호 확인</label>
            <input id="__password_confirm" name="password_confirm" type="password" required autocomplete="new-password" />
            <div class="message" id="__message"></div>
            <button type="button" id="__btn_register">가입하기</button>
        </form>
        <p class="info">이미 계정이 있으면 <a href="/admin/login">로그인</a>하세요.</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const messageEl = document.getElementById('message');
        if (params.get('error')) {
            messageEl.textContent = '이미 존재하는 아이디입니다. 다른 아이디를 사용해 주세요.';
        }
    </script>
</body>
</html>
